# --------------------------------
# Deploy PSGallary Package Stage
psgal_nuget:
  stage: deploy
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  script:
    - pwsh.exe
    - .\build\scripts\deploy-psgallary.ps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'

#-------------------------------------
# Deploy Coverage to Code cov ( Test Stage )
#-------------------------------------
coverage:
  stage: deploy
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'
 
  script:
    - ./devops/scripts/test-deploy-codecov-report.ps1
  artifacts:
    paths:
      - ./coverage.xml