#--------------------------------
# Create Release gitlab
#--------------------------------
gitlab:
  stage: release
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'
  script: 
    - .\build\scripts\release-from-tag-gitlab.ps1
  artifacts:
    paths:
      - ./dist/*.*.nupkg
      - ./dist/*.*.zip


#--------------------------------
# Create Release github
#--------------------------------
github:
  stage: release
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'
  script: 
    - .\build\scripts\release-from-tag-github.ps1
  artifacts:
    paths:
      - ./dist/*.*.nupkg
      - ./dist/*.*.zip


#--------------------------------
# Deploy GitLab Package
#--------------------------------
gitlab_nuget:
  stage: deploy
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  script:
    - ./devops/scripts/deploy-gitlab.ps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'
  artifacts:
    paths:
    - ./dist/*
    - ./coverage.xml


#--------------------------------
# Deploy Proget Packages ( Deply-Local Stage )
#--------------------------------
proget_nuget:
  stage: deploy
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  script:
    - ./devops/scripts/deploy-proget.ps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'
    # - if: '$CI_SERVER_URL == "https://$ENV:GITLAB_HOST"'
  artifacts:
    paths:
      - ./dist/*
      - ./coverage.xml

