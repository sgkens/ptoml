stages:
  - test
  - build
  - tag
  - release
  - deploy_local
  - deploy


#--------------------------------
# Pester ( Test Stage )
#--------------------------------
pester:
  stage: test
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  script:
    - invoke-Pester -Script .\test\Test-Unit-Pester.ps1 -CI || exit 1

#--------------------------------
# Pester Test Stage & Coverage ( Test Stage )
#--------------------------------
pester_coverage:
  stage: test
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "test" && $CI_BUILD_STATUS == "success"'
  script:
    - Invoke-Pester -Script .\build\scripts\test-pester-before-build.ps1 -CI || exit 1;
  artifacts:
    paths:
      - ./coverage.xml

#--------------------------------
# Script Analyzer ( Test Stage )
#--------------------------------
analyzer:
  stage: test
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_BUILD_STAGE == "test" && $CI_BUILD_STATUS == "success"'
  script:
    - ./devops/scripts/test_scriptanalyzer_before_build.ps1
  artifacts:
    paths:
      - ./coverage.xml

#--------------------------------
# Build Module Stage ( Build Stage )
#--------------------------------
build:
  stage: build
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "test" && $CI_BUILD_STATUS == "success"'
  script:
    - ./devops/scripts/build-module.ps1
  artifacts:
    paths:
      - ./dist/*
      - ./coverage.xml


#--------------------------------
# Create Nuget Packages Stage ( Build Stage )
#--------------------------------
packages:
  stage: build
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "build" && $CI_BUILD_STATUS == "success"'
  script:
    - ./devops/scripts/Build-packages.ps1
  artifacts:
    paths:
      - ./dist/*
      - ./coverage.xml


# --------------------------------
# Create tag for local gitlab instance ( Release Stage )
# --------------------------------
tag:
  stage: release
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "build" && $CI_BUILD_STATUS == "success"'
    # - if: '$CI_SERVER_URL == "https://$ENV:GITLAB_HOST"'
  script: 
    - .\devops\scripts\release-from-tag-gitlab-se.ps1
  artifacts:
    paths:
      - ./dist/*

# --------------------------------
# Mirror to gitlab and github
#  - mirror to public pointers before release stage
#  - Tags are automatically mirrored, however, we need to create a release manually via 
#    the public pointers
# --------------------------------
mirror:
  stage: release
  image: docker.io/phellams/phellams-psm-builder:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_BUILD_STAGE == "release" && $CI_BUILD_STATUS == "success"'
  script: 
    - .\build\scripts\mirror-create-pointers.ps1
  artifacts:
    paths:
      - ./dist/*


